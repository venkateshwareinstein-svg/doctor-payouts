<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Doctor Payouts - Dhanvantri Healthcare</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f5f8;color:#1c2230}
  header{background:#1f3a5f;color:#fff;padding:14px 18px;font-weight:600;font-size:16px}
  .card{max-width:420px;margin:28px auto;background:#fff;border-radius:12px;padding:22px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .who{color:#5a6475;font-size:14px;margin-bottom:18px;min-height:18px}
  label{display:block;font-size:14px;margin-bottom:6px}
  input[type=password],input[type=tel]{width:100%;font-size:22px;letter-spacing:8px;padding:12px;border:1px solid #c9d0db;border-radius:8px;text-align:center}
  .row{display:flex;gap:8px;align-items:flex-start;margin:14px 0 6px;font-size:13px;color:#3b4454}
  .hint{font-size:12px;color:#7a8394;margin:0 0 16px}
  button{width:100%;background:#1f3a5f;color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:600}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:14px;color:#b3261e;min-height:18px}
  .foot{max-width:420px;margin:0 auto 30px;padding:0 20px;font-size:12px;color:#7a8394}
</style>
</head>
<body>
<header>Dhanvantri Healthcare</header>
<div class="card">
  <h1>Doctor payout login</h1>
  <div class="who" id="who">Checking link…</div>
  <form id="f" autocomplete="off">
    <label for="pin">Enter your 4-digit PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" disabled>
    <label class="row"><input type="checkbox" id="remember"><span>Remember this personal link on this device. The PIN is never saved.</span></label>
    <p class="hint">On a shared device, leave this unchecked.</p>
    <button id="go" type="submit" disabled>Open statement</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<div class="foot">Your personal link and PIN are both required. If this page does not open your statement, contact the hospital accounts office.</div>
<script>
(function(){
  // Apps Script API (same deployment as the old link). No Google login or cookies are used.
  var API = 'https://script.google.com/macros/s/AKfycbysNWUC8MTmGSpw8w_fGpIae_Emj5q_bMk0cQVkJNPOwmjYE99HaYYan2x2hNlHmj-P9g/exec';
  var KEY = 'dp_link_v1';
  var $ = function(id){return document.getElementById(id);};

  function store(get, val){
    try { if (get) return JSON.parse(localStorage.getItem(KEY) || 'null');
          if (val) localStorage.setItem(KEY, JSON.stringify(val)); else localStorage.removeItem(KEY);
    } catch(e) { return null; }
  }

  var q = new URLSearchParams(location.search);
  var ctx = null;
  if (q.get('admin')) ctx = {admin: q.get('admin')};
  else if (q.get('d') && q.get('k')) ctx = {d: q.get('d'), k: q.get('k')};
  if (!ctx) ctx = store(true);
  else if (store(true)) $('remember').checked = true;

  function call(body){
    return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), credentials:'omit', redirect:'follow'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function payload(extra){
    var b = {}; for (var k in ctx) b[k] = ctx[k]; for (var e in extra) b[e] = extra[e]; return b;
  }

  if (!ctx) { $('who').textContent = 'This link is incomplete. Please open the full personal link sent to you.'; return; }

  call(payload({action:'info'})).then(function(r){
    if (!r.ok) { $('who').textContent = r.msg || 'This link is not valid.'; store(false, null); return; }
    $('who').textContent = r.label;
    $('pin').disabled = false; $('go').disabled = false; $('pin').focus();
  }).catch(function(){ $('who').textContent = 'Could not reach the server. Check internet and reload.'; });

  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var pin = $('pin').value.trim();
    if (!/^\d{4}$/.test(pin)) { $('msg').textContent = 'Enter the 4-digit PIN.'; return; }
    $('go').disabled = true; $('msg').style.color = '#5a6475'; $('msg').textContent = 'Opening…';
    call(payload({action:'open', pin: pin})).then(function(r){
      if (!r.ok) { $('msg').style.color = '#b3261e'; $('msg').textContent = r.msg || 'Wrong PIN.'; $('go').disabled = false; $('pin').value=''; return; }
      store(false, $('remember').checked ? ctx : null);
      document.open(); document.write(r.html); document.close();
    }).catch(function(){ $('msg').style.color = '#b3261e'; $('msg').textContent = 'Network problem. Please try again.'; $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
